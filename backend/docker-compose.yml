services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5 --auth-local=md5
    ports:
      - "55432:5432"
    volumes:
      - card_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d card"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://card:card@postgres:5432/card?schema=public
      PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3001}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5174}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  card_pgdata:
