services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: card
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: --auth-host=md5 --auth-local=md5
    volumes:
      - card_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d card"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - card

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      DATABASE_URL: postgresql://card:${POSTGRES_PASSWORD}@postgres:5432/card?schema=public
      PORT: 3000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      FRONTEND_ORIGIN: ${SITE_URL}
      ADMIN_ORIGIN: ${SITE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - card

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      GRAPHQL_URL: http://api:3000/graphql
      PUBLIC_GRAPHQL_URL: ${SITE_URL}/graphql
    depends_on:
      api:
        condition: service_healthy
    networks:
      - card

volumes:
  card_pgdata:

networks:
  card:
